<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login • Palpites IA</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #000000;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #ffffff;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 320px;
        padding: 30px;
        background: rgba(15, 15, 15, 0.9);
        border-radius: 20px;
        border: 2px solid #00ff88;
        box-shadow: 0 0 20px #00ff88;
        text-align: center;
        position: relative;
    }

    .bola-neon {
        width: 120px;
        height: 120px;
        margin: 0 auto 15px;
        border-radius: 50%;
        border: 5px solid rgba(0,255,136,0.2);
        border-top-color: #00ff88;
        animation: spin 1.6s linear infinite;
        position: relative;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .icone-raio {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 55px;
        height: 55px;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 0 10px #00ff88);
    }

    h1 {
        margin: 10px 0 25px 0;
        font-size: 28px;
        color: #00ff88;
        text-shadow: 0 0 10px #00ff88;
    }

    .input-group {
        text-align: left;
        margin-bottom: 15px;
    }

    .input-group label {
        font-size: 13px;
        color: #cccccc;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 2px solid #00ff88;
        background: #0f0f0f;
        color: #ffffff;
        outline: none;
        transition: 0.3s;
    }

    .input-group input:focus {
        box-shadow: 0 0 10px #00ff88;
    }

    .botao {
        width: 100%;
        padding: 14px;
        background: #00ff88;
        color: #000;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        box-shadow: 0 0 15px #00ff88;
    }

    .link {
        margin-top: 15px;
        display: block;
        font-size: 14px;
        color: #00ff88;
        text-decoration: none;
    }

</style>
</head>
<body>

<div class="container">

    <div class="bola-neon">
        <img src="/static/icons/raio.png" class="icone-raio">
    </div>

    <h1>Palpites IA</h1>

    <form id="loginForm">

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="input-group">
            <label>Senha</label>
            <input type="password" name="senha" required>
        </div>

        <button class="botao" type="submit">➜ Entrar no Sistema</button>

        <a class="link" href="/cadastro">Não tem conta? Cadastrar</a>

    </form>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const email = document.querySelector("input[name='email']").value;
    const senha = document.querySelector("input[name='senha']").value;

    const resposta = await fetch("/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ email: email, password: senha })
    });

    const data = await resposta.json();

    if(data.status === "ok") {
        window.location.href = "/dashboard";
    } else {
        alert(data.msg || "Email ou senha inválidos");
    }
});
</script>

</body>
</html>
